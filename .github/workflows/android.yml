name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Save APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: a2dp-autorouter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Alpha pre-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download APK built by this run
        uses: actions/download-artifact@v4
        with:
          name: a2dp-autorouter-debug-apk
          path: dist

      - name: Publish GitHub Pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp dist/app-debug.apk "A2DP-AutoRouter-${GITHUB_REF_NAME}-debug.apk"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              "A2DP-AutoRouter-${GITHUB_REF_NAME}-debug.apk" \
              --title "$GITHUB_REF_NAME (Alpha)" \
              --notes-file RELEASE_NOTES.md --prerelease --verify-tag
          else
            echo "Release $GITHUB_REF_NAME already exists; skipping to avoid editing it."
          fi
